[package]
name = "lpcalas"
version = "0.2.3"
description = "Lpcalas - glas, stream i chat"
edition = "2021"

[lib]
name = "lpcalas_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# Snimanje zvuka računara bez zvuka same aplikacije (process loopback).
wasapi = { git = "https://github.com/HEnquist/wasapi-rs", rev = "4d58f98729195bdfb458e58368ca2a46eb787a23" }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
