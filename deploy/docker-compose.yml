# Lpcalas server: backend (chat, korisnici, fajlovi) + LiveKit (glas i stream).
#
# Portovi koje treba otvoriti prema internetu (router / firewall):
#   8080/tcp  - aplikacija + LiveKit signalizacija (ide kroz backend)
#   7881/tcp  - glas/video preko TCP-a (rezerva kad UDP ne prolazi)
#   7882/udp  - glas/video (glavni put, najmanji ping)
#
# Pokretanje: koristi setup skriptu (windows/setup-host.ps1 ili linux/install.sh),
# ona napravi .env i livekit.yaml sa nasumičnim ključevima.

services:
  backend:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      LIVEKIT_URL_INTERNAL: http://livekit:7880
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - ./data:/data
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
